name: 🤖 Bot Download CAROOT Release
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  download:
    name: Bot Download & Verify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Download ZIP Release Terbaru
        uses: robinraju/release-downloader@v1
        with:
          repository: NSlocal/CAROOT
          latest: true          # ✅ AMBIL VERSI TERBARU OTOMATIS!
          filename: 'CAROOT-*.zip'
          out-file-path: 'downloads/'
          extract: false

      - name: 📋 Info File Downloaded
        run: |
          ls -la downloads/
          echo "✅ Bot berhasil download ZIP dari NSlocal/CAROOT!"

      - name: ✅ Verify ZIP Integrity
        run: |
          cd downloads/
          for f in *.zip; do
            echo "Verifikasi: $f"
            unzip -t "$f" 2>/dev/null && echo "✅ ZIP VALID — $f" || echo "❌ ZIP RUSAK — $f"
          done
