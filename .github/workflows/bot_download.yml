name: 🤖 Bot Download CAROOT Release
on:
  release:
    types: [published]   # ✅ HANYA JALAN SETELAH RELEASE BENAR-BENAR PUBLISH!
  workflow_dispatch:

jobs:
  download:
    name: Bot Download & Verify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Download ZIP Release TERBARU
        uses: robinraju/release-downloader@v1
        with:
          repository: NSlocal/CAROOT
          latest: true              # ✅ AMBIL VERSI TERBARU OTOMATIS
          filename: 'CAROOT-*.zip'  # ✅ Filter nama ZIP
          out-file-path: 'downloads/'
          extract: false
        continue-on-error: false

      - name: 📋 Info File Downloaded
        run: |
          echo "=== 📂 HASIL DOWNLOAD ==="
          ls -la downloads/
          echo ""
          if compgen -G "downloads/CAROOT-*.zip" > /dev/null; then
            echo "✅ ✅ ✅ ZIP BERHASIL DI-DOWNLOAD!"
          else
            echo "❌ ZIP BELUM ADA — Pastikan Release sudah dipublish di:"
            echo "👉 https://github.com/NSlocal/CAROOT/releases"
            exit 1
          fi

      - name: ✅ Verifikasi Integritas ZIP
        run: |
          cd downloads/
          echo "=== 🔐 VERIFIKASI ZIP ==="
          for f in CAROOT-*.zip; do
            if [ -f "$f" ]; then
              echo "📦 Cek File: $f"
              unzip -t "$f" 2>/dev/null && echo "✅ ZIP VALID — Tidak Rusak" || echo "❌ ZIP RUSAK / CORRUPT"
            fi
          done
