name: 🤖 Bot Download CAROOT Release
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  download:
    name: Bot Download & Verify
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Tunggu Release Siap
        run: sleep 15

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Download ZIP Terbaru
        uses: robinraju/release-downloader@v1
        with:
          repository: NSlocal/CAROOT
          latest: true
          filename: 'CAROOT-*.zip'
          out-file-path: 'downloads/'
          extract: false
        continue-on-error: true

      - name: 📋 Cek Hasil
        run: |
          ls -la downloads/ || true
          if compgen -G "downloads/CAROOT-*.zip" > /dev/null; then
            echo "✅ ZIP BERHASIL DI-DOWNLOAD!"
          else
            echo "⚠️ ZIP BELUM ADA — Cek di: https://github.com/NSlocal/CAROOT/releases"
            echo "👉 Pastikan Release SUDAH DIPUBLISH (bukan Draft!)"
            exit 1
          fi

      - name: ✅ Verifikasi ZIP
        run: |
          cd downloads/
          for f in CAROOT-*.zip; do
            echo "📦 Cek: $f"
            unzip -t "$f" 2>/dev/null && echo "✅ ZIP VALID" || echo "❌ ZIP RUSAK"
          done
