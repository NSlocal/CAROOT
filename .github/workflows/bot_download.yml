name: 🤖 Bot Download CAROOT Release
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  download:
    name: Bot Download & Verify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Download ZIP Release
        uses: robinraju/release-downloader@v1
        with:
          repository: NSlocal/CAROOT
          latest: true
          filename: 'CAROOT-*.zip'
          out-file-path: 'downloads/'
          extract: false

      - name: 📋 Info File
        run: |
          ls -la downloads/
          echo "✅ ZIP berhasil di-download!"

      - name: ✅ Verifikasi ZIP
        run: |
          cd downloads/
          for f in *.zip; do
            echo "📦 Cek: $f"
            unzip -t "$f" 2>/dev/null && echo "✅ ZIP VALID" || echo "❌ ZIP RUSAK"
          done
