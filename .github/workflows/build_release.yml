name: Build & Release CAROOT
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssl zip
          mkdir -p out

      - name: ✅ Set Izin Execute
        run: |
          chmod +x scripts/*.sh utils/*.sh 2>/dev/null || true

      - name: 📋 Debug File
        run: ls -laR

      - name: 🔐 Verify Cert
        run: |
          if [ -f "utils/7_verify_cert.sh" ]; then
            bash utils/7_verify_cert.sh
          fi

      - name: 📦 Build ZIP
        run: |
          make zip
          ls -la out/

      - name: 📤 Create Release — PASTI PUBLISH!
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CAROOT ${{ github.ref_name }}
          body: |
            # ✅ CAROOT ${{ github.ref_name }}
            **Repo:** https://github.com/NSlocal/CAROOT
            - ✅ CA Cert PEM
            - ✅ Installer Root + Non-Root
            - ✅ Bot Download ZIP
            ⚠️ Ganti cert/1_ca_cert.pem dengan cert ASLI sebelum install!
          files: out/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
