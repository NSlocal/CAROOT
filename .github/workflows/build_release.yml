name: Build & Release CAROOT
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssl zip
          mkdir -p out

      - name: ✅ Set Izin Execute
        run: |
          chmod +x scripts/*.sh utils/*.sh
          echo "✅ Izin diatur"

      - name: 📋 Debug — Tampilkan Semua File
        run: |
          echo "=== 📂 STRUKTUR FILE ==="
          ls -laR
          echo "========================"

      - name: 🔐 Verify Certificate
        run: |
          if [ -f "utils/7_verify_cert.sh" ]; then
            echo "✅ Menjalankan verify cert..."
            bash utils/7_verify_cert.sh  # ⬅️ PAKAI bash langsung, tidak ./
            echo "✅ Verify selesai — Lanjut Build ZIP"
          else
            echo "⚠️ utils/7_verify_cert.sh TIDAK ADA — lewati verify"
          fi
        shell: bash  # ⬅️ Pastikan pakai bash

      - name: 📦 Build Release ZIP
        run: |
          make zip
          ls -la out/

      - name: 📤 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CAROOT ${{ github.ref_name }}
          body: |
            # ✅ CAROOT — ${{ github.ref_name }}
            **Repo:** https://github.com/NSlocal/CAROOT
            
            ## 📦 Isi Paket
            - ✅ CA Certificate (PEM)
            - ✅ Installer Root + Non-Root
            - ✅ Pilih Mode Otomatis
            - ✅ Bot Download ZIP
            - ✅ Verify Script
            
            ## 📥 Cara Pakai
            ```bash
            ./scripts/3_download_release_zip.sh
            unzip CAROOT-*.zip
            chmod +x scripts/*.sh utils/*.sh
            ./scripts/4_install_cert.sh
            ```
            ⚠️ **Ganti cert/1_ca_cert.pem dengan cert PEM ASLI sebelum install!**
          files: out/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
