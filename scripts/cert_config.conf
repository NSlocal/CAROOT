[Cert]
FILE=cert/1_ca_cert.pem
FORMAT=PEM
TYPE=RootCA

[Android]
SYSTEM_DIR=/system/etc/security/cacerts
USER_DIR=/data/local/tmp/ca_certs
PERM=644

[Build]
VERSION=1.0.0
ZIP_NAME=CAROOT-v1.0.0.zip
OUT_DIR=out

[GitHub]
REPO=NSlocal/CAROOT
URL=https://github.com/NSlocal/CAROOT
WORKFLOW=Build & Release
TAG_PREFIX=v
